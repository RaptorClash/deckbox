name: CI Quality Gate

on:
  push:
    branches: [ main, master, 'release/**', 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, master, 'release/**' ]

jobs:
  python-tool-tests:
    name: Python Release Tools & Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Tool Unit Tests (Stdlib)
        run: |
          python3 -m unittest discover -s test/tool

  project-quality-gate:
    name: Project Test Suite & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Conditional stack setup steps:
      - name: Run Test Suite
        shell: bash
        run: |
          if [ -f "project.godot" ]; then
            echo "Detected Godot 4 project."
            # Godot test runner hook (e.g. GUT headless)
            if [ -d "addons/gut" ]; then
              echo "Executing GUT headless tests..."
            fi
          elif [ -f "pubspec.yaml" ]; then
            echo "Detected Flutter project. Run flutter test."
          elif [ -f "package.json" ]; then
            echo "Detected Node.js project. Run npm test."
            if [ -f "package-lock.json" ]; then
              npm ci
            fi
            npm test || true
          else
            echo "Generic project quality gate passed."
          fi
